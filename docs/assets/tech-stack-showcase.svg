<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="1080" height="390">
  <defs>
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D17"/>
      <stop offset="100%" stop-color="#061627"/>
    </linearGradient>
    <linearGradient id="ts-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="ts-shadow" x="-6%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="ts-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0E3052" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .tst { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .tsb { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .tsm { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <rect width="1080" height="390" rx="18" fill="url(#ts-bg)" stroke="#0E3052" stroke-width="1.5"/>
  <rect width="1080" height="390" rx="18" fill="url(#ts-grid)"/>

  <g transform="translate(36, 30)">
    <text x="0" y="18" fill="url(#ts-hdr)" class="tst" font-size="18" letter-spacing="1">FULL-STACK TECHNOLOGY ECOSYSTEM</text>
    <text x="0" y="36" fill="#94A3B8" class="tsb" font-size="12">Every core dependency engineered together seamlessly across React, Node.js, FFmpeg, TensorFlow, TOTP, and MongoDB</text>
  </g>

  <!-- 6 Tech Pillar Cards (3x2 grid) -->
  <!-- Card 1: Frontend -->
  <g transform="translate(36, 86)" filter="url(#ts-shadow)">
    <rect width="320" height="130" rx="12" fill="#071729" stroke="#0EA5E9" stroke-width="1.2"/>
    <rect x="12" y="0" width="296" height="2.5" fill="#22D3EE"/>
    <circle cx="26" cy="24" r="5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" fill="#F8FAFC" class="tst" font-size="14">Frontend SPA Stack</text>
    <text x="18" y="54" fill="#38BDF8" class="tsm" font-size="10">React 18.3 • Vite 6.0 • Tailwind v4</text>
    <text x="18" y="76" fill="#CBD5E1" class="tsm" font-size="10">React Router v7 • TanStack Query v5</text>
    <text x="18" y="98" fill="#94A3B8" class="tsm" font-size="10">Axios • Lucide • React Hot Toast</text>
    <text x="18" y="116" fill="#64748B" class="tsm" font-size="9.5">Glacier Sub-Zero Arctic UI System</text>
  </g>

  <!-- Card 2: Backend -->
  <g transform="translate(380, 86)" filter="url(#ts-shadow)">
    <rect width="320" height="130" rx="12" fill="#071729" stroke="#10B981" stroke-width="1.2"/>
    <rect x="12" y="0" width="296" height="2.5" fill="#10B981"/>
    <circle cx="26" cy="24" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" fill="#F8FAFC" class="tst" font-size="14">Backend &amp; Real-Time API</text>
    <text x="18" y="54" fill="#34D399" class="tsm" font-size="10">Node 20+ • Express 4.21 • Socket.IO</text>
    <text x="18" y="76" fill="#CBD5E1" class="tsm" font-size="10">Zod Schema Validation • Morgan</text>
    <text x="18" y="98" fill="#94A3B8" class="tsm" font-size="10">Multer • Cookie-Parser • CORS</text>
    <text x="18" y="116" fill="#64748B" class="tsm" font-size="9.5">14 Modular REST Endpoints</text>
  </g>

  <!-- Card 3: Video & HLS -->
  <g transform="translate(724, 86)" filter="url(#ts-shadow)">
    <rect width="320" height="130" rx="12" fill="#071729" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="12" y="0" width="296" height="2.5" fill="#F59E0B"/>
    <circle cx="26" cy="24" r="5" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" fill="#F8FAFC" class="tst" font-size="14">Streaming &amp; Transcoding</text>
    <text x="18" y="54" fill="#FBBF24" class="tsm" font-size="10">HLS.js 1.5 • AES-128 • Fluent-FFmpeg</text>
    <text x="18" y="76" fill="#CBD5E1" class="tsm" font-size="10">ffmpeg-static • ffprobe • P-Queue</text>
    <text x="18" y="98" fill="#94A3B8" class="tsm" font-size="10">Google Drive API v3 • Watermark</text>
    <text x="18" y="116" fill="#64748B" class="tsm" font-size="9.5">Multi-Quality 144p-1080p Pipeline</text>
  </g>

  <!-- Card 4: AI Proctoring -->
  <g transform="translate(36, 236)" filter="url(#ts-shadow)">
    <rect width="320" height="130" rx="12" fill="#071729" stroke="#F43F5E" stroke-width="1.2"/>
    <rect x="12" y="0" width="296" height="2.5" fill="#FB7185"/>
    <circle cx="26" cy="24" r="5" fill="#FB7185">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" fill="#F8FAFC" class="tst" font-size="14">AI Vision &amp; Proctoring</text>
    <text x="18" y="54" fill="#FB7185" class="tsm" font-size="10">@tensorflow/tfjs • COCO-SSD 2.2</text>
    <text x="18" y="76" fill="#CBD5E1" class="tsm" font-size="10">lite_mobilenet_v2 Phone Detection</text>
    <text x="18" y="98" fill="#94A3B8" class="tsm" font-size="10">Web Audio Beep • Fullscreen Lock</text>
    <text x="18" y="116" fill="#64748B" class="tsm" font-size="9.5">Zero-Latency Browser Anti-Cheat</text>
  </g>

  <!-- Card 5: 2FA & Security -->
  <g transform="translate(380, 236)" filter="url(#ts-shadow)">
    <rect width="320" height="130" rx="12" fill="#071729" stroke="#8B5CF6" stroke-width="1.2"/>
    <rect x="12" y="0" width="296" height="2.5" fill="#A855F7"/>
    <circle cx="26" cy="24" r="5" fill="#A855F7">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" fill="#F8FAFC" class="tst" font-size="14">Cryptography &amp; 2FA Auth</text>
    <text x="18" y="54" fill="#C084FC" class="tsm" font-size="10">otpauth (RFC 6238 TOTP) • qrcode</text>
    <text x="18" y="76" fill="#CBD5E1" class="tsm" font-size="10">JSON Web Tokens • Bcrypt • Helmet</text>
    <text x="18" y="98" fill="#94A3B8" class="tsm" font-size="10">Express-Rate-Limit • Sanitize</text>
    <text x="18" y="116" fill="#64748B" class="tsm" font-size="9.5">Single-Session Device Guard</text>
  </g>

  <!-- Card 6: Database & Storage -->
  <g transform="translate(724, 236)" filter="url(#ts-shadow)">
    <rect width="320" height="130" rx="12" fill="#071729" stroke="#14B8A6" stroke-width="1.2"/>
    <rect x="12" y="0" width="296" height="2.5" fill="#2DD4BF"/>
    <circle cx="26" cy="24" r="5" fill="#2DD4BF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" fill="#F8FAFC" class="tst" font-size="14">Database &amp; Cloud Storage</text>
    <text x="18" y="54" fill="#2DD4BF" class="tsm" font-size="10">MongoDB 7+ • Mongoose 8.7 • GridFS</text>
    <text x="18" y="76" fill="#CBD5E1" class="tsm" font-size="10">Magic-Byte File Scan • Local FS</text>
    <text x="18" y="98" fill="#94A3B8" class="tsm" font-size="10">Extensible S3 / Cloudflare R2</text>
    <text x="18" y="116" fill="#64748B" class="tsm" font-size="9.5">Vercel Edge + Persistent VPS API</text>
  </g>
</svg>