<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 340" width="1140" height="340">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020810"/>
      <stop offset="45%" stop-color="#041222"/>
      <stop offset="100%" stop-color="#071a30"/>
    </linearGradient>

    <linearGradient id="hero-title-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="75%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;300%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hero-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hero-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="hero-cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="hero-cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#030D17"/>
    </linearGradient>

    <filter id="hero-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="hero-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#0E3052" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="1.2" fill="#22D3EE" fill-opacity="0.25"/>
    </pattern>

    <clipPath id="hero-clip">
      <rect width="1140" height="340" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .h-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; }
    .h-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .h-mono  { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  </style>

  <g clip-path="url(#hero-clip)">
    <!-- Base -->
    <rect width="1140" height="340" fill="url(#hero-bg)"/>
    <rect width="1140" height="340" fill="url(#hero-grid)"/>

    <!-- Ambient Breathing Orbs -->
    <circle cx="170" cy="170" r="190" fill="#06B6D4" opacity="0.10">
      <animate attributeName="r" values="175;205;175" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.14;0.08" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="80" r="160" fill="#3B82F6" opacity="0.09">
      <animate attributeName="r" values="150;180;150" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="310" r="140" fill="#10B981" opacity="0.06">
      <animate attributeName="r" values="130;160;130" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Sweeping Radar Light Beam -->
    <rect x="-260" y="0" width="260" height="340" fill="url(#hero-sweep)">
      <animate attributeName="x" from="-260" to="1140" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Floating Arctic Data Particles -->
    <circle cx="0" cy="0" r="2.2" fill="#22D3EE" opacity="0.7">
      <animateMotion path="M 320,310 C 420,250 560,280 780,190 C 920,130 1050,90 1120,40" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1.8" fill="#818CF8" opacity="0.7">
      <animateMotion path="M 980,320 C 860,260 690,220 510,270 C 390,300 280,230 220,160" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#34D399" opacity="0.7">
      <animateMotion path="M 50,40 C 260,80 420,30 680,95 C 880,145 990,65 1100,110" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- LEFT: 3D Isometric Orbiting Core Emblem -->
    <g transform="translate(155, 170)" filter="url(#hero-shadow)">
      <!-- Outer Rotating Telemetry Ring -->
      <circle cx="0" cy="0" r="92" fill="none" stroke="#0E3052" stroke-width="1.5" stroke-dasharray="10 6">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <!-- Counter-rotating Cyan Arc -->
      <circle cx="0" cy="0" r="78" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="45 120 20 120" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <!-- Orbiting Nodes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
        <circle cx="92" cy="0" r="4.5" fill="#22D3EE"/>
        <circle cx="-92" cy="0" r="3.5" fill="#818CF8"/>
      </g>

      <!-- Levitating 3D Isometric Cube Shield -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,-5; 0,5; 0,-5" dur="4.2s" repeatCount="indefinite"/>
        <!-- Isometric 3D Hex Cube -->
        <polygon points="0,-46 42,-23 0,0 -42,-23" fill="url(#hero-cube-top)" stroke="#A5F3FC" stroke-width="1"/>
        <polygon points="-42,-23 0,0 0,48 -42,25" fill="url(#hero-cube-left)" stroke="#38BDF8" stroke-width="0.8"/>
        <polygon points="42,-23 0,0 0,48 42,25" fill="url(#hero-cube-right)" stroke="#0EA5E9" stroke-width="0.8"/>
        <!-- Glowing Play Triangle etched on Front/Top -->
        <polygon points="-10,-12 16,1 -10,14" fill="#FFFFFF" opacity="0.92" transform="translate(2, 2) scale(0.85)">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite"/>
        </polygon>
      </g>
    </g>

    <!-- RIGHT / CENTER CONTENT -->
    <g transform="translate(295, 58)">
      <!-- Live Status Pill -->
      <rect x="0" y="0" width="298" height="26" rx="13" fill="#071729" stroke="#0E3052" stroke-width="1.2"/>
      <circle cx="16" cy="13" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="13" r="4" fill="none" stroke="#10B981" stroke-width="1.5">
        <animate attributeName="r" values="4;10" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="17" fill="#A5F3FC" class="h-mono" font-size="11" font-weight="700" letter-spacing="0.8">ENTERPRISE MERN • AI-PROCTORED LMS</text>

      <!-- Main Shimmer Title -->
      <text x="0" y="74" fill="url(#hero-title-grad)" class="h-title" font-size="44" letter-spacing="1">MENTORE SOLUTION LMS</text>

      <!-- Subtitle with Glowing Terminal Prompt (Deterministic Monospace Width) -->
      <text x="0" y="106" fill="#22D3EE" class="h-mono" font-size="14" font-weight="800">&gt;_</text>
      <text x="24" y="106" fill="#CBD5E1" class="h-mono" font-size="13" font-weight="500">Adaptive AES-128 HLS Video • Mandatory TOTP 2FA • TensorFlow.js Exam Guard</text>
      <rect x="602" y="94" width="7" height="14" rx="1.5" fill="#22D3EE" opacity="0.9">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Animated Feature Telemetry Chips (Staggered Pulse) -->
      <g transform="translate(0, 134)">
        <!-- Chip 1 -->
        <rect x="0" y="0" width="175" height="38" rx="9" fill="#071729" stroke="#0891B2" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <circle cx="16" cy="19" r="3.5" fill="#22D3EE"/>
        <text x="28" y="16" fill="#F8FAFC" class="h-mono" font-size="10.5" font-weight="700">AES-128 HLS</text>
        <text x="28" y="29" fill="#64748B" class="h-mono" font-size="9.5">144p-1080p + Watermark</text>

        <!-- Chip 2 -->
        <rect x="190" y="0" width="180" height="38" rx="9" fill="#071729" stroke="#059669" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4s" begin="1s" repeatCount="indefinite"/>
        </rect>
        <circle cx="206" cy="19" r="3.5" fill="#10B981"/>
        <text x="218" y="16" fill="#F8FAFC" class="h-mono" font-size="10.5" font-weight="700">RFC 6238 2FA</text>
        <text x="218" y="29" fill="#64748B" class="h-mono" font-size="9.5">Mandatory Student TOTP</text>

        <!-- Chip 3 -->
        <rect x="385" y="0" width="185" height="38" rx="9" fill="#071729" stroke="#E11D48" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4s" begin="2s" repeatCount="indefinite"/>
        </rect>
        <circle cx="401" cy="19" r="3.5" fill="#FB7185"/>
        <text x="413" y="16" fill="#F8FAFC" class="h-mono" font-size="10.5" font-weight="700">COCO-SSD AI</text>
        <text x="413" y="29" fill="#64748B" class="h-mono" font-size="9.5">Webcam &amp; Tab Lockdown</text>

        <!-- Chip 4 -->
        <rect x="585" y="0" width="185" height="38" rx="9" fill="#071729" stroke="#6366F1" stroke-width="1.2">
          <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4s" begin="3s" repeatCount="indefinite"/>
        </rect>
        <circle cx="601" cy="19" r="3.5" fill="#818CF8"/>
        <text x="613" y="16" fill="#F8FAFC" class="h-mono" font-size="10.5" font-weight="700">SOCKET.IO RT</text>
        <text x="613" y="29" fill="#64748B" class="h-mono" font-size="9.5">Q&amp;A, Jobs &amp; GridFS</text>
      </g>

      <!-- Live Animated Equalizer / Signal Bar at Bottom Right -->
      <g transform="translate(0, 198)">
        <text x="0" y="13" fill="#64748B" class="h-mono" font-size="10.5">ARCHITECTED BY <tspan fill="#38BDF8" font-weight="700">SHUBHAM GAYKE</tspan> • ZERO-TRUST • REAL-TIME TELEMETRY</text>
        <g transform="translate(690, 0)">
          <rect x="0" y="8" width="4" height="8" rx="2" fill="#22D3EE">
            <animate attributeName="height" values="4;15;6;14;4" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="y" values="12;1;10;2;12" dur="1.1s" repeatCount="indefinite"/>
          </rect>
          <rect x="8" y="4" width="4" height="12" rx="2" fill="#0EA5E9">
            <animate attributeName="height" values="14;5;15;6;14" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="y" values="2;11;1;10;2" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <rect x="16" y="6" width="4" height="10" rx="2" fill="#3B82F6">
            <animate attributeName="height" values="6;16;4;12;6" dur="1.3s" repeatCount="indefinite"/>
            <animate attributeName="y" values="10;0;12;4;10" dur="1.3s" repeatCount="indefinite"/>
          </rect>
          <rect x="24" y="2" width="4" height="14" rx="2" fill="#10B981">
            <animate attributeName="height" values="12;4;14;5;12" dur="1.0s" repeatCount="indefinite"/>
            <animate attributeName="y" values="4;12;2;11;4" dur="1.0s" repeatCount="indefinite"/>
          </rect>
          <text x="36" y="13" fill="#10B981" class="h-mono" font-size="10" font-weight="700">LIVE</text>
        </g>
      </g>
    </g>

    <!-- Outer Framing Border -->
    <rect x="1" y="1" width="1138" height="338" rx="19" fill="none" stroke="#0E3052" stroke-width="1.5"/>
    <!-- Animated top rim light -->
    <rect x="-180" y="0" width="180" height="2" fill="#22D3EE" opacity="0.85">
      <animate attributeName="x" from="-180" to="1140" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>