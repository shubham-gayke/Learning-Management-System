<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430">
  <defs>
    <linearGradient id="hls-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D17"/>
      <stop offset="100%" stop-color="#071729"/>
    </linearGradient>
    <linearGradient id="hls-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hls-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020810"/>
      <stop offset="50%" stop-color="#07192E"/>
      <stop offset="100%" stop-color="#030E1C"/>
    </linearGradient>
    <filter id="hls-shadow" x="-6%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <pattern id="hls-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0E3052" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .ht { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .hb { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .hm { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <rect width="1080" height="430" rx="18" fill="url(#hls-bg)" stroke="#0E3052" stroke-width="1.5"/>
  <rect width="1080" height="430" rx="18" fill="url(#hls-grid)"/>

  <!-- Header -->
  <g transform="translate(36, 30)">
    <text x="0" y="18" fill="url(#hls-hdr)" class="ht" font-size="18" letter-spacing="1">CUSTOM VLC VIDEO ENGINE &amp; AES-128 HLS PIPELINE</text>
    <text x="0" y="36" fill="#94A3B8" class="hb" font-size="12">Automated Google Drive Ingestion → Multi-Bitrate FFmpeg Transcoding → Floating Watermark Playback</text>
  </g>

  <!-- LEFT PANEL: TRANSCODING PIPELINE -->
  <g transform="translate(36, 86)" filter="url(#hls-shadow)">
    <rect width="415" height="310" rx="14" fill="#061424" stroke="#0E3052" stroke-width="1.2"/>
    <text x="20" y="28" fill="#22D3EE" class="hm" font-size="11" font-weight="700">SERVER TRANSCODING QUEUE (P-QUEUE)</text>

    <!-- Step 1: Drive -->
    <rect x="20" y="44" width="375" height="48" rx="8" fill="#0A1E36" stroke="#1E3A8A"/>
    <text x="34" y="65" fill="#F8FAFC" class="ht" font-size="12.5">1. Google Drive API v3 Ingest</text>
    <text x="34" y="81" fill="#94A3B8" class="hm" font-size="10">Service Account fetches OBS recording</text>
    <circle cx="372" cy="68" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Flow connector 1->2 -->
    <line x1="207" y1="92" x2="207" y2="112" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3 3"/>
    <circle r="3" fill="#22D3EE">
      <animateMotion path="M 207,92 L 207,112" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Step 2: FFmpeg + FFprobe -->
    <rect x="20" y="112" width="375" height="58" rx="8" fill="#0A1E36" stroke="#0284C7"/>
    <text x="34" y="133" fill="#F8FAFC" class="ht" font-size="12.5">2. FFprobe + Fluent-FFmpeg (144p-1080p)</text>
    <rect x="34" y="145" width="305" height="8" rx="4" fill="#030D17"/>
    <rect x="34" y="145" width="305" height="8" rx="4" fill="#22D3EE">
      <animate attributeName="width" values="15;305;305;15" keyTimes="0;0.75;0.92;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="350" y="153" fill="#22D3EE" class="hm" font-size="10">HLS</text>

    <!-- Flow connector 2->3 -->
    <line x1="207" y1="170" x2="207" y2="190" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
    <circle r="3" fill="#34D399">
      <animateMotion path="M 207,170 L 207,190" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Step 3: AES-128 & Gatekeeper -->
    <rect x="20" y="190" width="375" height="48" rx="8" fill="#062925" stroke="#059669"/>
    <text x="34" y="211" fill="#34D399" class="ht" font-size="12.5">3. AES-128 Key &amp; Batch Gatekeeper</text>
    <text x="34" y="227" fill="#A7F3D0" class="hm" font-size="10">/api/stream/:id/key • Cache: no-store</text>

    <!-- Socket.IO Progress Emit -->
    <rect x="20" y="252" width="375" height="42" rx="8" fill="#030D17" stroke="#6366F1" stroke-dasharray="5 3"/>
    <circle cx="38" cy="273" r="4" fill="#818CF8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="277" fill="#A5B4FC" class="hm" font-size="10.5">SOCKET.IO EMIT: transcoding_progress (0% → 100%)</text>
  </g>

  <!-- STREAM BRIDGE ARROW -->
  <g transform="translate(451, 220)">
    <line x1="0" y1="0" x2="48" y2="0" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle r="4.5" fill="#22D3EE">
      <animateMotion path="M 0,0 L 48,0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT PANEL: ANIMATED CUSTOM VLC PLAYER UI -->
  <g transform="translate(499, 86)" filter="url(#hls-shadow)">
    <!-- 3D Outer Player Frame -->
    <rect x="5" y="7" width="545" height="310" rx="14" fill="#020810" stroke="#083344"/>
    <rect width="545" height="310" rx="14" fill="url(#hls-screen)" stroke="#0891B2" stroke-width="1.5"/>

    <!-- Top Video Header Overlay -->
    <rect x="0" y="0" width="545" height="40" rx="14" fill="#030D17" fill-opacity="0.85"/>
    <circle cx="22" cy="20" r="5" fill="#22D3EE"/>
    <text x="36" y="24" fill="#F8FAFC" class="ht" font-size="12">AWS VPC Peering &amp; Transit Gateway — Lecture 14</text>
    <rect x="448" y="10" width="80" height="20" rx="5" fill="#0891B2" fill-opacity="0.3" stroke="#22D3EE" stroke-width="0.8"/>
    <text x="488" y="23" fill="#22D3EE" class="hm" font-size="9.5" font-weight="700" text-anchor="middle">1080p HD</text>

    <!-- Animated Waveform Visualizer in Center Video Viewport -->
    <g transform="translate(152, 115)" opacity="0.55">
      <rect x="0" y="18" width="12" height="24" rx="4" fill="#0EA5E9">
        <animate attributeName="height" values="14;48;18;42;14" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="23;6;21;9;23" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="8" width="12" height="44" rx="4" fill="#22D3EE">
        <animate attributeName="height" values="46;16;52;20;46" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="7;22;4;20;7" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="12" width="12" height="36" rx="4" fill="#38BDF8">
        <animate attributeName="height" values="20;56;14;44;20" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;2;23;8;20" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="18" width="12" height="24" rx="4" fill="#06B6D4">
        <animate attributeName="height" values="40;14;48;18;40" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;23;6;21;10" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="96" y="10" width="12" height="40" rx="4" fill="#3B82F6">
        <animate attributeName="height" values="16;46;20;50;16" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;7;20;5;22" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="120" y="16" width="12" height="28" rx="4" fill="#22D3EE">
        <animate attributeName="height" values="44;18;38;12;44" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;21;11;24;8" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="144" y="12" width="12" height="36" rx="4" fill="#10B981">
        <animate attributeName="height" values="18;50;16;42;18" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="21;5;22;9;21" dur="1.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="168" y="20" width="12" height="20" rx="4" fill="#38BDF8">
        <animate attributeName="height" values="36;12;46;20;36" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;24;7;20;12" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="192" y="14" width="12" height="32" rx="4" fill="#0EA5E9">
        <animate attributeName="height" values="14;44;24;50;14" dur="1.45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="23;8;18;5;23" dur="1.45s" repeatCount="indefinite"/>
      </rect>
      <rect x="216" y="18" width="12" height="24" rx="4" fill="#22D3EE">
        <animate attributeName="height" values="48;16;40;14;48" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;22;10;23;6" dur="1.05s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- REAL MOVING FLOATING WATERMARK (Repositions like Watermark.jsx!) -->
    <g>
      <animateMotion path="M 55,70 L 290,78 L 280,195 L 65,180 Z" dur="8s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="195" height="22" rx="6" fill="#000000" fill-opacity="0.45" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="97" y="14" fill="#E0F2FE" fill-opacity="0.7" class="hm" font-size="10" text-anchor="middle">Student Name • user@domain</text>
    </g>

    <!-- Bottom VLC Controls Bar -->
    <rect x="0" y="246" width="545" height="64" rx="14" fill="#030D17" fill-opacity="0.92"/>
    <!-- Seek Bar Background -->
    <rect x="18" y="256" width="509" height="5" rx="2.5" fill="#1E293B"/>
    <!-- Buffered Range -->
    <rect x="18" y="256" width="380" height="5" rx="2.5" fill="#0E3052"/>
    <!-- Animated Playing Progress Bar -->
    <rect x="18" y="256" width="260" height="5" rx="2.5" fill="#22D3EE">
      <animate attributeName="width" values="40;460;40" dur="10s" repeatCount="indefinite"/>
    </rect>
    <circle cx="278" cy="258.5" r="6" fill="#FFFFFF" stroke="#22D3EE" stroke-width="2">
      <animate attributeName="cx" values="58;478;58" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Player Buttons -->
    <polygon points="24,274 24,292 38,283" fill="#22D3EE"/>
    <text x="52" y="287" fill="#94A3B8" class="hm" font-size="11">&#171; -5s   +5s &#187;</text>
    <text x="172" y="287" fill="#E2E8F0" class="hm" font-size="11">14:22 / 48:10</text>

    <!-- Right Controls -->
    <rect x="330" y="272" width="44" height="20" rx="5" fill="#071729" stroke="#0E3052"/>
    <text x="352" y="286" fill="#38BDF8" class="hm" font-size="10" font-weight="700" text-anchor="middle">1.25x</text>

    <rect x="384" y="272" width="76" height="20" rx="5" fill="#071729" stroke="#0E3052"/>
    <text x="422" y="286" fill="#10B981" class="hm" font-size="10" font-weight="700" text-anchor="middle">AUTOSAVED</text>

    <rect x="470" y="272" width="55" height="20" rx="5" fill="#0891B2" fill-opacity="0.25" stroke="#22D3EE" stroke-width="0.8"/>
    <text x="497" y="286" fill="#22D3EE" class="hm" font-size="9.5" text-anchor="middle">[ FS ]</text>
  </g>
</svg>