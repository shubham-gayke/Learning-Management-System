<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420">
  <defs>
    <linearGradient id="tfa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D17"/>
      <stop offset="100%" stop-color="#041E1C"/>
    </linearGradient>
    <linearGradient id="tfa-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="tfa-shadow" x="-8%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <pattern id="tfa-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#064E3B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .ft { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .fb { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .fm { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <rect width="1080" height="420" rx="18" fill="url(#tfa-bg)" stroke="#065F46" stroke-width="1.5"/>
  <rect width="1080" height="420" rx="18" fill="url(#tfa-grid)"/>

  <g transform="translate(36, 30)">
    <text x="0" y="18" fill="url(#tfa-hdr)" class="ft" font-size="18" letter-spacing="1">ZERO-TRUST RFC 6238 TOTP 2FA WORKFLOW</text>
    <text x="0" y="36" fill="#94A3B8" class="fb" font-size="12">Powered by otpauth &amp; qrcode • 6-Digit SHA1 Tokens (30s Window) • Mandatory Enforcement for Students</text>
  </g>

  <line x1="160" y1="195" x2="920" y2="195" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle r="5" fill="#34D399">
    <animateMotion path="M 160,195 L 920,195" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#22D3EE">
    <animateMotion path="M 160,195 L 920,195" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- STAGE 1 -->
  <g transform="translate(36, 92)" filter="url(#tfa-shadow)">
    <rect width="220" height="210" rx="12" fill="#071729" stroke="#0284C7" stroke-width="1.3"/>
    <text x="16" y="28" fill="#38BDF8" class="fm" font-size="10" font-weight="700">STEP 01</text>
    <text x="16" y="48" fill="#F8FAFC" class="ft" font-size="14.5">Credential Auth</text>
    <rect x="16" y="68" width="188" height="32" rx="6" fill="#030D17" stroke="#0E3052"/>
    <text x="26" y="88" fill="#94A3B8" class="fm" font-size="10">email@student.edu</text>
    <rect x="16" y="110" width="188" height="32" rx="6" fill="#030D17" stroke="#0E3052"/>
    <text x="26" y="130" fill="#22D3EE" class="fm" font-size="12">••••••••••••</text>
    <text x="16" y="172" fill="#94A3B8" class="fb" font-size="11">Bcryptjs hash check</text>
    <text x="16" y="190" fill="#38BDF8" class="fm" font-size="10">POST /api/auth/login</text>
  </g>

  <!-- STAGE 2 -->
  <g transform="translate(298, 92)" filter="url(#tfa-shadow)">
    <rect width="220" height="210" rx="12" fill="#071729" stroke="#0EA5E9" stroke-width="1.3"/>
    <text x="16" y="28" fill="#22D3EE" class="fm" font-size="10" font-weight="700">STEP 02</text>
    <text x="16" y="48" fill="#F8FAFC" class="ft" font-size="14.5">QR Setup (20-Byte)</text>
    <g transform="translate(65, 65)">
      <rect width="88" height="88" rx="8" fill="#FFFFFF"/>
      <rect x="10" y="10" width="22" height="22" fill="none" stroke="#0F172A" stroke-width="4"/>
      <rect x="17" y="17" width="8" height="8" fill="#0F172A"/>
      <rect x="56" y="10" width="22" height="22" fill="none" stroke="#0F172A" stroke-width="4"/>
      <rect x="63" y="17" width="8" height="8" fill="#0F172A"/>
      <rect x="10" y="56" width="22" height="22" fill="none" stroke="#0F172A" stroke-width="4"/>
      <rect x="17" y="63" width="8" height="8" fill="#0F172A"/>
      <rect x="40" y="40" width="10" height="10" fill="#0F172A"/>
      <rect x="56" y="56" width="12" height="12" fill="#0F172A"/>
      <rect x="40" y="16" width="8" height="16" fill="#0F172A"/>
      <line x1="6" y1="8" x2="82" y2="8" stroke="#10B981" stroke-width="2.5">
        <animate attributeName="y1" values="8;80;8" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="8;80;8" dur="2.5s" repeatCount="indefinite"/>
      </line>
    </g>
    <text x="110" y="180" fill="#94A3B8" class="fb" font-size="11" text-anchor="middle">Scan in Google Auth / Authy</text>
    <text x="110" y="196" fill="#22D3EE" class="fm" font-size="9.5" text-anchor="middle">Base32 Secret + DataURL</text>
  </g>

  <!-- STAGE 3 -->
  <g transform="translate(560, 92)" filter="url(#tfa-shadow)">
    <rect width="220" height="210" rx="12" fill="#06211F" stroke="#10B981" stroke-width="1.3"/>
    <text x="16" y="28" fill="#34D399" class="fm" font-size="10" font-weight="700">STEP 03</text>
    <text x="16" y="48" fill="#F8FAFC" class="ft" font-size="14.5">30s TOTP Verification</text>
    <circle cx="110" cy="109" r="37" fill="none" stroke="#064E3B" stroke-width="5"/>
    <circle cx="110" cy="109" r="37" fill="none" stroke="#10B981" stroke-width="5" stroke-dasharray="233" stroke-linecap="round" transform="rotate(-90 110 109)">
      <animate attributeName="stroke-dashoffset" from="0" to="233" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="110" y="114" fill="#34D399" class="fm" font-size="13.5" font-weight="800" text-anchor="middle">839 204</text>
    <text x="110" y="170" fill="#A7F3D0" class="fb" font-size="11" text-anchor="middle">6-Digit HMAC-SHA1 Token</text>
    <text x="110" y="188" fill="#34D399" class="fm" font-size="9.5" text-anchor="middle">HTTP-Only JWT Issued</text>
  </g>

  <!-- STAGE 4 -->
  <g transform="translate(822, 92)" filter="url(#tfa-shadow)">
    <rect width="222" height="210" rx="12" fill="#062925" stroke="#34D399" stroke-width="1.5"/>
    <text x="16" y="28" fill="#6EE7B7" class="fm" font-size="10" font-weight="700">STEP 04</text>
    <text x="16" y="48" fill="#F8FAFC" class="ft" font-size="14.5">Mandatory Lock</text>
    <rect x="26" y="74" width="170" height="44" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="111" y="100" fill="#6EE7B7" class="fm" font-size="11" font-weight="700" text-anchor="middle">✓ MANDATORY &amp; ACTIVE</text>
    <text x="111" y="148" fill="#CBD5E1" class="fb" font-size="11" text-anchor="middle">Cannot be disabled in Profile</text>
    <text x="111" y="168" fill="#FCA5A5" class="fm" font-size="10" text-anchor="middle">POST /2fa/disable → 403</text>
    <text x="111" y="190" fill="#34D399" class="fm" font-size="9.5" text-anchor="middle">Protected Forever</text>
  </g>

  <!-- BOTTOM SPECS STRIP (Replaces white bullets!) -->
  <g transform="translate(36, 322)">
    <rect width="1008" height="76" rx="12" fill="#041918" stroke="#065F46" stroke-width="1.2"/>

    <rect x="16" y="14" width="314" height="48" rx="8" fill="#030D17" stroke="#0E7490" stroke-width="0.9"/>
    <text x="28" y="34" fill="#22D3EE" class="fm" font-size="10" font-weight="700">STANDARDIZED CRYPTO SPECS</text>
    <text x="28" y="50" fill="#94A3B8" class="fb" font-size="11">20-Byte Base32 • SHA1 • 6-Digit • 30s</text>

    <rect x="347" y="14" width="314" height="48" rx="8" fill="#030D17" stroke="#10B981" stroke-width="0.9"/>
    <text x="359" y="34" fill="#34D399" class="fm" font-size="10" font-weight="700">UNIVERSAL AUTHENTICATOR APPS</text>
    <text x="359" y="50" fill="#94A3B8" class="fb" font-size="11">Google Auth • Microsoft Auth • Authy • 1Password</text>

    <rect x="678" y="14" width="314" height="48" rx="8" fill="#030D17" stroke="#F43F5E" stroke-width="0.9"/>
    <text x="690" y="34" fill="#FB7185" class="fm" font-size="10" font-weight="700">API ENFORCEMENT IN TWOFACTOR.JS</text>
    <text x="690" y="50" fill="#94A3B8" class="fb" font-size="11">Student Profile Lock • 403 on Disable Attempt</text>
  </g>
</svg>