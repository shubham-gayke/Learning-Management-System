<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340">
  <defs>
    <linearGradient id="dt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D17"/>
      <stop offset="100%" stop-color="#061627"/>
    </linearGradient>
    <linearGradient id="dt-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="dt-shadow" x="-6%" y="-6%" width="116%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <pattern id="dt-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0E3052" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .dt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .db { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .dm { font-family: 'JetBrains Mono', Consolas, monospace; }
    .dt-dash { stroke-dasharray: 6 4; animation: dtFlow 1.2s linear infinite; }
    @keyframes dtFlow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1080" height="340" rx="18" fill="url(#dt-bg)" stroke="#0E3052" stroke-width="1.5"/>
  <rect width="1080" height="340" rx="18" fill="url(#dt-grid)"/>

  <g transform="translate(36, 30)">
    <text x="0" y="18" fill="url(#dt-hdr)" class="dt" font-size="18" letter-spacing="1">PRODUCTION CLOUD DEPLOYMENT ARCHITECTURE</text>
    <text x="0" y="36" fill="#94A3B8" class="db" font-size="12">High-Speed Global Edge Frontend + Persistent CPU Container for FFmpeg HLS + Managed Atlas &amp; S3/R2 Storage</text>
  </g>

  <!-- Animated Horizontal Bus Line Behind Nodes -->
  <line x1="200" y1="195" x2="880" y2="195" stroke="#22D3EE" stroke-width="2.5" class="dt-dash"/>
  <circle r="5" fill="#22D3EE">
    <animateMotion path="M 200,195 L 880,195" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#10B981">
    <animateMotion path="M 880,195 L 200,195" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- NODE 1: VERCEL EDGE -->
  <g transform="translate(36, 90)" filter="url(#dt-shadow)">
    <rect x="4" y="6" width="295" height="212" rx="14" fill="#04101D" stroke="#083344"/>
    <rect width="295" height="212" rx="14" fill="#071729" stroke="#22D3EE" stroke-width="1.3"/>
    <rect x="12" y="0" width="271" height="2.5" fill="#22D3EE"/>

    <text x="18" y="28" fill="#22D3EE" class="dm" font-size="10" font-weight="700">EDGE CDN • CLIENT</text>
    <text x="18" y="50" fill="#F8FAFC" class="dt" font-size="15.5">Vercel / Netlify Edge</text>
    <rect x="18" y="66" width="259" height="44" rx="8" fill="#030D17" stroke="#0E3052"/>
    <text x="30" y="85" fill="#38BDF8" class="dm" font-size="10">Build: npm run build</text>
    <text x="30" y="101" fill="#94A3B8" class="dm" font-size="9.5">Output: client/dist (React 18)</text>

    <text x="18" y="136" fill="#CBD5E1" class="db" font-size="11.5">• Global low-latency static assets</text>
    <text x="18" y="158" fill="#CBD5E1" class="db" font-size="11.5">• TensorFlow AI runs client-side</text>
    <rect x="18" y="174" width="259" height="22" rx="5" fill="#0C4A6E" fill-opacity="0.35"/>
    <text x="147" y="189" fill="#67E8F9" class="dm" font-size="9.5" text-anchor="middle">VITE_API_URL=https://api.domain</text>
  </g>

  <!-- PROTOCOL BADGE 1 -->
  <g transform="translate(335, 180)">
    <rect width="54" height="26" rx="8" fill="#030D17" stroke="#22D3EE" stroke-width="1"/>
    <text x="27" y="17" fill="#22D3EE" class="dm" font-size="9.5" font-weight="700" text-anchor="middle">HTTPS</text>
  </g>

  <!-- NODE 2: PERSISTENT VPS / RENDER -->
  <g transform="translate(392, 90)" filter="url(#dt-shadow)">
    <rect x="4" y="6" width="295" height="212" rx="14" fill="#050B18" stroke="#1E1B4B"/>
    <rect width="295" height="212" rx="14" fill="#071729" stroke="#818CF8" stroke-width="1.3"/>
    <rect x="12" y="0" width="271" height="2.5" fill="#818CF8"/>

    <text x="18" y="28" fill="#A5B4FC" class="dm" font-size="10" font-weight="700">DEDICATED CPU • API</text>
    <text x="18" y="50" fill="#F8FAFC" class="dt" font-size="15.5">VPS / Render Disk</text>
    <rect x="18" y="66" width="259" height="44" rx="8" fill="#030D17" stroke="#312E81"/>
    <text x="30" y="85" fill="#A5B4FC" class="dm" font-size="10">Min Spec: 2 vCPU / 4 GB RAM</text>
    <text x="30" y="101" fill="#FBBF24" class="dm" font-size="9.5">Non-Serverless (FFmpeg Queue)</text>

    <text x="18" y="136" fill="#CBD5E1" class="db" font-size="11.5">• Persistent disk for HLS segments</text>
    <text x="18" y="158" fill="#CBD5E1" class="db" font-size="11.5">• Express API + Socket.IO cluster</text>
    <rect x="18" y="174" width="259" height="22" rx="5" fill="#312E81" fill-opacity="0.4"/>
    <text x="147" y="189" fill="#C7D2FE" class="dm" font-size="9.5" text-anchor="middle">EC2 / DigitalOcean / Hetzner</text>
  </g>

  <!-- PROTOCOL BADGE 2 -->
  <g transform="translate(691, 180)">
    <rect width="54" height="26" rx="8" fill="#030D17" stroke="#10B981" stroke-width="1"/>
    <text x="27" y="17" fill="#34D399" class="dm" font-size="9.5" font-weight="700" text-anchor="middle">TLS IO</text>
  </g>

  <!-- NODE 3: ATLAS + OBJECT STORAGE -->
  <g transform="translate(748, 90)" filter="url(#dt-shadow)">
    <rect x="4" y="6" width="296" height="212" rx="14" fill="#03130F" stroke="#064E3B"/>
    <rect width="296" height="212" rx="14" fill="#071729" stroke="#10B981" stroke-width="1.3"/>
    <rect x="12" y="0" width="272" height="2.5" fill="#10B981"/>

    <text x="18" y="28" fill="#34D399" class="dm" font-size="10" font-weight="700">MANAGED DATA • STORAGE</text>
    <text x="18" y="50" fill="#F8FAFC" class="dt" font-size="15.5">Atlas + GridFS + S3/R2</text>
    <rect x="18" y="66" width="260" height="44" rx="8" fill="#030D17" stroke="#065F46"/>
    <text x="30" y="85" fill="#34D399" class="dm" font-size="10">MongoDB Atlas + GridFS Docs</text>
    <text x="30" y="101" fill="#6EE7B7" class="dm" font-size="9.5">STORAGE_DRIVER = local | s3</text>

    <text x="18" y="136" fill="#CBD5E1" class="db" font-size="11.5">• Authenticated HLS key proxying</text>
    <text x="18" y="158" fill="#CBD5E1" class="db" font-size="11.5">• Zero-downtime replica backups</text>
    <rect x="18" y="174" width="260" height="22" rx="5" fill="#064E3B" fill-opacity="0.45"/>
    <text x="148" y="189" fill="#6EE7B7" class="dm" font-size="9.5" text-anchor="middle">AWS S3 / Cloudflare R2 Ready</text>
  </g>
</svg>