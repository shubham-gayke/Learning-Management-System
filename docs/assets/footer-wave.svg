<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 220" width="1140" height="220">
  <defs>
    <linearGradient id="fw-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020912"/>
      <stop offset="50%" stop-color="#061D33"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
    <linearGradient id="fw-wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="fw-wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="fw-clip">
      <rect width="1140" height="220" rx="18"/>
    </clipPath>
    <filter id="fw-shadow" x="-6%" y="-6%" width="116%" height="122%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <style>
    .fwt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .fwm { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <g clip-path="url(#fw-clip)">
    <rect width="1140" height="220" fill="url(#fw-bg)" stroke="#0E3052" stroke-width="1.5"/>

    <!-- Animated Wave 1 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1140 0" dur="11s" repeatCount="indefinite"/>
      <path d="M0,145 C285,100 285,190 570,145 C855,100 855,190 1140,145 C1425,100 1425,190 1710,145 C1995,100 1995,190 2280,145 L2280,220 L0,220 Z" fill="url(#fw-wave1)"/>
    </g>

    <!-- Animated Wave 2 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-1140 0" to="0 0" dur="15s" repeatCount="indefinite"/>
      <path d="M0,160 C285,200 285,120 570,160 C855,200 855,120 1140,160 C1425,200 1425,120 1710,160 C1995,200 1995,120 2280,160 L2280,220 L0,220 Z" fill="url(#fw-wave2)"/>
    </g>

    <!-- Floating Author & Intellectual Property Glass Card -->
    <g transform="translate(210, 26)" filter="url(#fw-shadow)">
      <rect width="720" height="122" rx="14" fill="#061424" fill-opacity="0.92" stroke="#0891B2" stroke-width="1.3"/>
      <rect x="14" y="0" width="692" height="2.5" fill="#22D3EE"/>

      <circle cx="48" cy="30" r="5" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="672" cy="30" r="5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="360" y="34" fill="#38BDF8" class="fwm" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">AUTHOR &amp; INTELLECTUAL PROPERTY</text>
      <text x="360" y="64" fill="#F8FAFC" class="fwt" font-size="22" text-anchor="middle" letter-spacing="1">
        LEAD ARCHITECT: <tspan fill="#22D3EE">SHUBHAM GAYKE</tspan>
      </text>
      <text x="360" y="88" fill="#CBD5E1" class="fwm" font-size="11.5" text-anchor="middle">
        MENTORE SOLUTION LMS • © 2026 SHUBHAM GAYKE • ALL RIGHTS RESERVED
      </text>
      <text x="360" y="108" fill="#64748B" class="fwm" font-size="10" text-anchor="middle">
        BUILT FOR SCALABLE, ZERO-TRUST TECHNICAL EDUCATION
      </text>
    </g>
  </g>
</svg>