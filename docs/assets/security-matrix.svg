<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 710" width="1080" height="710">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D17"/>
      <stop offset="50%" stop-color="#061629"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
    <linearGradient id="sec-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="sec-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1E36"/>
      <stop offset="100%" stop-color="#071222"/>
    </linearGradient>
    <filter id="sec-shadow" x="-8%" y="-8%" width="120%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <pattern id="sec-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0E3052" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .st { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sb { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .sm { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <rect width="1080" height="710" rx="20" fill="url(#sec-bg)" stroke="#0E3052" stroke-width="1.5"/>
  <rect width="1080" height="710" rx="20" fill="url(#sec-grid)"/>

  <!-- HEADER -->
  <g transform="translate(50, 38)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#071729" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="19" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="14;21;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M23 10 L34 15 V24 C34 31 23 36 23 36 C23 36 12 31 12 24 V15 Z" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 22 L22 26 L29 19" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="62" y="21" fill="url(#sec-header)" class="st" font-size="21" letter-spacing="1.2">ZERO-TRUST SECURITY &amp; DRM DEFENSE MATRIX</text>
    <text x="62" y="40" fill="#94A3B8" class="sb" font-size="12.5">Live visual simulation of active cryptographic locks, dynamic watermarking, 2FA, and AI proctoring</text>
  </g>

  <!-- ==================== CARD 1: AES-128 HLS ==================== -->
  <g transform="translate(50, 110)" filter="url(#sec-shadow)">
    <!-- 3D Extrude Base -->
    <rect x="5" y="7" width="470" height="170" rx="14" fill="#04101D" stroke="#083344"/>
    <rect width="470" height="170" rx="14" fill="url(#sec-card)" stroke="#0284C7" stroke-width="1.3"/>
    <rect x="14" y="0" width="442" height="2.5" rx="1" fill="#22D3EE"/>

    <text x="22" y="28" fill="#F87171" class="sm" font-size="10" font-weight="700">THREAT: DIRECT MP4 PIRACY</text>
    <text x="22" y="48" fill="#F8FAFC" class="st" font-size="16">AES-128 HLS Chunk Encryption</text>
    <rect x="355" y="18" width="96" height="22" rx="11" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="0.9"/>
    <text x="403" y="33" fill="#38BDF8" class="sm" font-size="9.5" font-weight="700" text-anchor="middle">DRM LOCKED</text>

    <!-- Live Animated AES Chunk Pipe -->
    <rect x="22" y="64" width="426" height="44" rx="8" fill="#030D17" stroke="#0E3052"/>
    <text x="34" y="90" fill="#64748B" class="sm" font-size="10">RAW</text>
    <line x1="65" y1="86" x2="210" y2="86" stroke="#0E3052" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Animated Data Chunks entering AES gate -->
    <rect x="0" y="-7" width="20" height="14" rx="3" fill="#22D3EE">
      <animateMotion path="M 70,86 L 200,86" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <!-- AES Encryption Gate -->
    <rect x="200" y="71" width="70" height="30" rx="6" fill="#0891B2" fill-opacity="0.3" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="235" y="90" fill="#22D3EE" class="sm" font-size="10" font-weight="700" text-anchor="middle">AES-128</text>
    <!-- Encrypted segments exiting -->
    <line x1="275" y1="86" x2="410" y2="86" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="0" y="-7" width="22" height="14" rx="3" fill="#10B981">
      <animateMotion path="M 278,86 L 405,86" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="424" y="90" fill="#34D399" class="sm" font-size="10">.ts</text>

    <text x="22" y="132" fill="#CBD5E1" class="sb" font-size="12">• No raw MP4 URLs or Drive links exposed to client</text>
    <text x="22" y="152" fill="#94A3B8" class="sb" font-size="12">• Ephemeral 16-byte key with Cache-Control: no-store</text>
  </g>

  <!-- ==================== CARD 2: FLOATING WATERMARK ==================== -->
  <g transform="translate(560, 110)" filter="url(#sec-shadow)">
    <rect x="5" y="7" width="470" height="170" rx="14" fill="#120B04" stroke="#78350F"/>
    <rect width="470" height="170" rx="14" fill="url(#sec-card)" stroke="#D97706" stroke-width="1.3"/>
    <rect x="14" y="0" width="442" height="2.5" rx="1" fill="#F59E0B"/>

    <text x="22" y="28" fill="#F87171" class="sm" font-size="10" font-weight="700">THREAT: SCREEN RECORDING LEAKS</text>
    <text x="22" y="48" fill="#F8FAFC" class="st" font-size="16">Dynamic Floating Watermark</text>
    <rect x="342" y="18" width="108" height="22" rx="11" fill="#D97706" fill-opacity="0.25" stroke="#F59E0B" stroke-width="0.9"/>
    <text x="396" y="33" fill="#FBBF24" class="sm" font-size="9.5" font-weight="700" text-anchor="middle">FORENSIC ID</text>

    <!-- Live Moving Watermark Viewport Simulation -->
    <rect x="22" y="64" width="426" height="44" rx="8" fill="#030D17" stroke="#451A03"/>
    <g>
      <animateMotion path="M 35,69 L 260,69 L 260,86 L 45,86 Z" dur="6s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="142" height="18" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="0.7"/>
      <text x="71" y="12" fill="#FCD34D" class="sm" font-size="9" text-anchor="middle">Student • mail@lms</text>
    </g>

    <text x="22" y="132" fill="#CBD5E1" class="sb" font-size="12">• Relocates smoothly across random bounds every 16 seconds</text>
    <text x="22" y="152" fill="#94A3B8" class="sb" font-size="12">• Visible in native fullscreen, cinema &amp; iOS pseudo-fullscreen</text>
  </g>

  <!-- ==================== CARD 3: SINGLE DEVICE GUARD ==================== -->
  <g transform="translate(50, 305)" filter="url(#sec-shadow)">
    <rect x="5" y="7" width="470" height="170" rx="14" fill="#09081B" stroke="#312E81"/>
    <rect width="470" height="170" rx="14" fill="url(#sec-card)" stroke="#6366F1" stroke-width="1.3"/>
    <rect x="14" y="0" width="442" height="2.5" rx="1" fill="#818CF8"/>

    <text x="22" y="28" fill="#F87171" class="sm" font-size="10" font-weight="700">THREAT: ACCOUNT SHARING</text>
    <text x="22" y="48" fill="#F8FAFC" class="st" font-size="16">Single-Session Device Guard</text>
    <rect x="350" y="18" width="100" height="22" rx="11" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="0.9"/>
    <text x="400" y="33" fill="#A5B4FC" class="sm" font-size="9.5" font-weight="700" text-anchor="middle">1 DEVICE ONLY</text>

    <!-- Live Device Switch Animation -->
    <rect x="22" y="64" width="426" height="44" rx="8" fill="#030D17" stroke="#1E1B4B"/>
    <!-- Old Session -->
    <rect x="34" y="72" width="145" height="28" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#EF4444" stroke-width="1">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="106" y="90" fill="#FCA5A5" class="sm" font-size="9.5" text-anchor="middle">OLD TAB: REVOKED ✕</text>
    <!-- Switch Arrow -->
    <path d="M 192 86 H 275" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle r="3.5" fill="#22D3EE">
      <animateMotion path="M 192,86 L 275,86" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- New Session -->
    <rect x="285" y="72" width="150" height="28" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1.2"/>
    <text x="360" y="90" fill="#34D399" class="sm" font-size="9.5" text-anchor="middle">NEW DEVICE: ACTIVE ✓</text>

    <text x="22" y="132" fill="#CBD5E1" class="sb" font-size="12">• Unique activeSessionId invalidated immediately on new login</text>
    <text x="22" y="152" fill="#94A3B8" class="sb" font-size="12">• Blocks concurrent video streaming when sharing credentials</text>
  </g>

  <!-- ==================== CARD 4: TOTP 2FA ==================== -->
  <g transform="translate(560, 305)" filter="url(#sec-shadow)">
    <rect x="5" y="7" width="470" height="170" rx="14" fill="#03130F" stroke="#064E3B"/>
    <rect width="470" height="170" rx="14" fill="url(#sec-card)" stroke="#10B981" stroke-width="1.3"/>
    <rect x="14" y="0" width="442" height="2.5" rx="1" fill="#34D399"/>

    <text x="22" y="28" fill="#F87171" class="sm" font-size="10" font-weight="700">THREAT: CREDENTIAL COMPROMISE</text>
    <text x="22" y="48" fill="#F8FAFC" class="st" font-size="16">Mandatory RFC 6238 TOTP 2FA</text>
    <rect x="338" y="18" width="112" height="22" rx="11" fill="#059669" fill-opacity="0.25" stroke="#10B981" stroke-width="0.9"/>
    <text x="394" y="33" fill="#34D399" class="sm" font-size="9.5" font-weight="700" text-anchor="middle">MANDATORY 2FA</text>

    <!-- Live 30s TOTP Countdown Simulation -->
    <rect x="22" y="64" width="426" height="44" rx="8" fill="#030D17" stroke="#064E3B"/>
    <circle cx="52" cy="86" r="13" fill="none" stroke="#064E3B" stroke-width="3"/>
    <circle cx="52" cy="86" r="13" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="82" stroke-linecap="round" transform="rotate(-90 52 86)">
      <animate attributeName="stroke-dashoffset" from="0" to="82" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="91" fill="#34D399" class="sm" font-size="16" font-weight="800" letter-spacing="4">
      492 817
      <animate attributeName="opacity" values="1;1;0.4;1" keyTimes="0;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <rect x="295" y="75" width="142" height="22" rx="6" fill="#064E3B" fill-opacity="0.45" stroke="#34D399" stroke-width="0.8"/>
    <text x="366" y="89" fill="#6EE7B7" class="sm" font-size="9.5" text-anchor="middle">403 ON STUDENT DISABLE</text>

    <text x="22" y="132" fill="#CBD5E1" class="sb" font-size="12">• Google Authenticator / Authy compatible QR onboarding</text>
    <text x="22" y="152" fill="#94A3B8" class="sb" font-size="12">• Student role strictly forbidden from disabling 2FA via API</text>
  </g>

  <!-- ==================== CARD 5: BATCH ISOLATION ==================== -->
  <g transform="translate(50, 500)" filter="url(#sec-shadow)">
    <rect x="5" y="7" width="470" height="170" rx="14" fill="#060D1E" stroke="#1E3A8A"/>
    <rect width="470" height="170" rx="14" fill="url(#sec-card)" stroke="#3B82F6" stroke-width="1.3"/>
    <rect x="14" y="0" width="442" height="2.5" rx="1" fill="#60A5FA"/>

    <text x="22" y="28" fill="#F87171" class="sm" font-size="10" font-weight="700">THREAT: CROSS-BATCH ACCESS</text>
    <text x="22" y="48" fill="#F8FAFC" class="st" font-size="16">Strict Batch Isolation Guard</text>
    <rect x="342" y="18" width="108" height="22" rx="11" fill="#1D4ED8" fill-opacity="0.28" stroke="#3B82F6" stroke-width="0.9"/>
    <text x="396" y="33" fill="#60A5FA" class="sm" font-size="9.5" font-weight="700" text-anchor="middle">BATCH LOCKED</text>

    <!-- Batch Verification Animation -->
    <rect x="22" y="64" width="426" height="44" rx="8" fill="#030D17" stroke="#1E3A8A"/>
    <rect x="36" y="73" width="115" height="26" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1"/>
    <text x="93" y="90" fill="#34D399" class="sm" font-size="10" text-anchor="middle">BATCH B-28 ✓</text>

    <rect x="168" y="73" width="130" height="26" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#EF4444" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="233" y="90" fill="#FCA5A5" class="sm" font-size="10" text-anchor="middle">BATCH B-29 403 ✕</text>

    <rect x="315" y="73" width="120" height="26" rx="6" fill="#1E3A8A" fill-opacity="0.4" stroke="#60A5FA" stroke-width="1"/>
    <text x="375" y="90" fill="#93C5FD" class="sm" font-size="10" text-anchor="middle">MAX 1 CHANGE</text>

    <text x="22" y="132" fill="#CBD5E1" class="sb" font-size="12">• Stream keys check req.user.batch == lecture.batch</text>
    <text x="22" y="152" fill="#94A3B8" class="sb" font-size="12">• Only 1 batch transfer permitted per student (403 enforced)</text>
  </g>

  <!-- ==================== CARD 6: AI PROCTOR ==================== -->
  <g transform="translate(560, 500)" filter="url(#sec-shadow)">
    <rect x="5" y="7" width="470" height="170" rx="14" fill="#18060E" stroke="#881337"/>
    <rect width="470" height="170" rx="14" fill="url(#sec-card)" stroke="#F43F5E" stroke-width="1.3"/>
    <rect x="14" y="0" width="442" height="2.5" rx="1" fill="#FB7185"/>

    <text x="22" y="28" fill="#F87171" class="sm" font-size="10" font-weight="700">THREAT: EXAM MISCONDUCT</text>
    <text x="22" y="48" fill="#F8FAFC" class="st" font-size="16">AI Computer Vision Proctor</text>
    <rect x="342" y="18" width="108" height="22" rx="11" fill="#BE123C" fill-opacity="0.3" stroke="#F43F5E" stroke-width="0.9"/>
    <text x="396" y="33" fill="#FDA4AF" class="sm" font-size="9.5" font-weight="700" text-anchor="middle">AI PROCTORED</text>

    <!-- Live Laser Vision Scan Bar -->
    <rect x="22" y="64" width="426" height="44" rx="8" fill="#030D17" stroke="#881337"/>
    <!-- Mini Webcam Box with Sweeping Scan -->
    <rect x="34" y="70" width="46" height="32" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <circle cx="57" cy="83" r="6" fill="none" stroke="#34D399" stroke-width="1.2"/>
    <path d="M48 98 C50 91 64 91 66 98" fill="none" stroke="#34D399" stroke-width="1.2"/>
    <line x1="36" y1="72" x2="78" y2="72" stroke="#FB7185" stroke-width="1.5">
      <animate attributeName="y1" values="72;100;72" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="72;100;72" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <text x="95" y="83" fill="#34D399" class="sm" font-size="10">COCO-SSD SCANNING • PHONE DETECT MAX: 2</text>
    <text x="95" y="99" fill="#FDA4AF" class="sm" font-size="9.5">FULLSCREEN LOCK • TAB SWITCH MAX: 5 • AUDIO BEEP</text>

    <text x="22" y="132" fill="#CBD5E1" class="sb" font-size="12">• TensorFlow.js lite_mobilenet_v2 detects mobile phones live</text>
    <text x="22" y="152" fill="#94A3B8" class="sb" font-size="12">• Auto-terminates exam with 0 marks on exceeding thresholds</text>
  </g>
</svg>