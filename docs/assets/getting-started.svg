<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440">
  <defs>
    <linearGradient id="gs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030D17"/>
      <stop offset="100%" stop-color="#061629"/>
    </linearGradient>
    <linearGradient id="gs-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="gs-shadow" x="-6%" y="-6%" width="116%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <pattern id="gs-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#0E3052" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .gt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .gb { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .gm { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>

  <rect width="1080" height="440" rx="18" fill="url(#gs-bg)" stroke="#0E3052" stroke-width="1.5"/>
  <rect width="1080" height="440" rx="18" fill="url(#gs-grid)"/>

  <!-- Header -->
  <g transform="translate(36, 30)">
    <text x="0" y="18" fill="url(#gs-hdr)" class="gt" font-size="18" letter-spacing="1">GETTING STARTED — QUICK INSTALLATION &amp; CLOUD SETUP</text>
    <text x="0" y="36" fill="#94A3B8" class="gb" font-size="12">Requires Node.js v20+ &amp; MongoDB • Copy .env.example templates and launch concurrently in seconds</text>
  </g>

  <!-- LEFT: ANIMATED DARK TERMINAL -->
  <g transform="translate(36, 84)" filter="url(#gs-shadow)">
    <rect width="540" height="324" rx="14" fill="#020810" stroke="#0891B2" stroke-width="1.3"/>
    <rect width="540" height="32" rx="14" fill="#071729"/>
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="38" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="16" r="5" fill="#10B981"/>
    <text x="80" y="20" fill="#94A3B8" class="gm" font-size="10.5">zsh — mentore-lms-quickstart</text>

    <!-- Sequential Animated Command Line Highlights -->
    <text x="20" y="60" fill="#64748B" class="gm" font-size="10"># 1. Clone &amp; Install Root + Client + Server</text>
    <text x="20" y="80" fill="#22D3EE" class="gm" font-size="11">$ git clone .../Learning-Management-System.git</text>
    <text x="20" y="100" fill="#38BDF8" class="gm" font-size="11">$ cd Learning-Management-System &amp;&amp; npm run install:all</text>

    <text x="20" y="132" fill="#64748B" class="gm" font-size="10"># 2. Create Local Env Configs (Never Commit .env!)</text>
    <text x="20" y="152" fill="#A5B4FC" class="gm" font-size="11">$ cp server/.env.example server/.env &amp;&amp; cp client/.env.example client/.env</text>

    <text x="20" y="184" fill="#64748B" class="gm" font-size="10"># 3. Seed Initial Batches (B-26..B-31) &amp; Trainer</text>
    <text x="20" y="204" fill="#FBBF24" class="gm" font-size="11">$ npm run seed</text>

    <text x="20" y="236" fill="#64748B" class="gm" font-size="10"># 4. Boot Concurrent Vite (:5173) &amp; Express (:5000)</text>
    <text x="20" y="256" fill="#34D399" class="gm" font-size="11.5" font-weight="700">$ npm run dev</text>
    <rect x="122" y="244" width="7" height="14" rx="1" fill="#34D399">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Live Boot Status Badges -->
    <rect x="20" y="278" width="155" height="28" rx="6" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" stroke-width="0.9"/>
    <circle cx="34" cy="292" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="296" fill="#6EE7B7" class="gm" font-size="9.5">UI :5173 ONLINE</text>

    <rect x="190" y="278" width="160" height="28" rx="6" fill="#0C4A6E" fill-opacity="0.35" stroke="#22D3EE" stroke-width="0.9"/>
    <circle cx="204" cy="292" r="3.5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="216" y="296" fill="#A5F3FC" class="gm" font-size="9.5">API :5000 ONLINE</text>

    <rect x="365" y="278" width="155" height="28" rx="6" fill="#1E1B4B" fill-opacity="0.45" stroke="#818CF8" stroke-width="0.9"/>
    <text x="442" y="296" fill="#C7D2FE" class="gm" font-size="9.5" text-anchor="middle">MONGO ATLAS OK</text>
  </g>

  <!-- RIGHT: ENV SECURITY & GOOGLE DRIVE SETUP -->
  <g transform="translate(598, 84)" filter="url(#gs-shadow)">
    <!-- Card Top: Zero-Secret Env Policy -->
    <rect width="446" height="150" rx="14" fill="#071729" stroke="#10B981" stroke-width="1.2"/>
    <rect x="12" y="0" width="422" height="2.5" fill="#10B981"/>
    <text x="20" y="26" fill="#34D399" class="gm" font-size="10.5" font-weight="700">SECURE ENVIRONMENT BLUEPRINT</text>
    <text x="20" y="48" fill="#F8FAFC" class="gt" font-size="14">Zero Hardcoded Credentials Policy</text>
    <text x="20" y="72" fill="#CBD5E1" class="gm" font-size="10">• Set local JWT_SECRET (32+ chars) &amp; MONGODB_URI</text>
    <text x="20" y="92" fill="#CBD5E1" class="gm" font-size="10">• Define private TRAINER_EMAIL / TRAINER_PASSWORD</text>
    <text x="20" y="112" fill="#94A3B8" class="gm" font-size="10">• Set ALLOW_MULTIPLE_SESSIONS=false for anti-share</text>
    <text x="20" y="132" fill="#6EE7B7" class="gm" font-size="10">• server/.env &amp; secrets/ are strictly gitignored</text>

    <!-- Card Bottom: Google Drive API Setup -->
    <g transform="translate(0, 166)">
      <rect width="446" height="158" rx="14" fill="#071729" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="12" y="0" width="422" height="2.5" fill="#F59E0B"/>
      <text x="20" y="26" fill="#FBBF24" class="gm" font-size="10.5" font-weight="700">GOOGLE DRIVE OBS INGESTION (OPTIONAL)</text>
      <text x="20" y="48" fill="#F8FAFC" class="gt" font-size="14">Service Account 4-Step Pipeline</text>

      <!-- 4 Mini Connected Steps -->
      <rect x="20" y="64" width="95" height="44" rx="6" fill="#030D17" stroke="#0E3052"/>
      <text x="67" y="83" fill="#38BDF8" class="gm" font-size="9" text-anchor="middle">1. GCP Project</text>
      <text x="67" y="97" fill="#64748B" class="gm" font-size="8" text-anchor="middle">Enable Drive v3</text>

      <rect x="124" y="64" width="98" height="44" rx="6" fill="#030D17" stroke="#0E3052"/>
      <text x="173" y="83" fill="#22D3EE" class="gm" font-size="9" text-anchor="middle">2. Service Acct</text>
      <text x="173" y="97" fill="#64748B" class="gm" font-size="8" text-anchor="middle">Viewer Role</text>

      <rect x="231" y="64" width="96" height="44" rx="6" fill="#030D17" stroke="#0E3052"/>
      <text x="279" y="83" fill="#FBBF24" class="gm" font-size="9" text-anchor="middle">3. JSON Key</text>
      <text x="279" y="97" fill="#64748B" class="gm" font-size="8" text-anchor="middle">server/secrets/</text>

      <rect x="336" y="64" width="92" height="44" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#10B981"/>
      <text x="382" y="83" fill="#34D399" class="gm" font-size="9" text-anchor="middle">4. Share Link</text>
      <text x="382" y="97" fill="#6EE7B7" class="gm" font-size="8" text-anchor="middle">Auto-Transcode</text>

      <!-- Moving progress dot across the 4 boxes -->
      <circle r="3.5" fill="#FBBF24">
        <animateMotion path="M 67,118 L 382,118" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <line x1="67" y1="118" x2="382" y2="118" stroke="#1E293B" stroke-width="1.5"/>
      <text x="20" y="142" fill="#94A3B8" class="gm" font-size="9.5">Paste Drive link in Trainer UI → HLS segments built automatically</text>
    </g>
  </g>
</svg>