name: Keep Render Server Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f --max-time 60 https://learning-management-system-h1ct.onrender.com/health || echo "Ping dispatched"
